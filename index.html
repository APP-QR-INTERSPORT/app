<script>
(function () {
  const translations = {
    el: {title:'Κατέβασε το INTERSPORT App', description:'Διαθέσιμο για iOS και Android.', apple:'Διαθέσιμο στο', google:'Διαθέσιμο στο', footer:'INTERSPORT Greece · Σύνδεσμοι λήψης εφαρμογής', appleLabel:'Λήψη του INTERSPORT από το App Store', googleLabel:'Λήψη του INTERSPORT από το Google Play'},
    en: {title:'Get the INTERSPORT App', description:'Available for iOS and Android.', apple:'GET IT ON', google:'GET IT ON', footer:'INTERSPORT Greece · Official app download links', appleLabel:'Download INTERSPORT on the Apple App Store', googleLabel:'Get INTERSPORT on Google Play'}
  };
  function setLanguage(lang) {
    const t = translations[lang] || translations.en;
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelector('meta[name="description"]').content = t.description;
    document.getElementById('heading').textContent = t.title;
    document.getElementById('description').textContent = t.description;
    document.getElementById('apple-small').textContent = t.apple;
    document.getElementById('google-small').textContent = t.google;
    document.getElementById('footer').textContent = t.footer;
    document.querySelector('.store--apple').setAttribute('aria-label', t.appleLabel);
    document.querySelector('.store--google').setAttribute('aria-label', t.googleLabel);
    document.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === lang)));
  }
  document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => setLanguage(button.dataset.lang)));
  const queryLang = new URLSearchParams(window.location.search).get('lang');
  setLanguage(queryLang === 'en' ? 'en' : 'el');
})();
</script>
