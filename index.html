
<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174a98">
  <meta name="description" content="Κατέβασε το INTERSPORT App για iPhone ή Android.">
  <title>Κατέβασε το INTERSPORT App</title>

  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #17233d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #f1f5fb;
      padding: 20px;
    }

    .panel {
      width: min(100%, 430px);
      padding: 40px 25px 30px;
      text-align: center;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 14px 44px #17315a18;
    }

    .brand-logo {
      display: block;
      width: min(100%, 290px);
      height: auto;
      max-height: 110px;
      object-fit: contain;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      line-height: 1.2;
      margin: 28px 0 10px;
    }

    p {
      color: #596579;
      line-height: 1.55;
      margin: 0 0 25px;
    }

    .language-switch {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 0 0 23px;
    }

    .language-switch button {
      border: 1px solid #d6deeb;
      background: #fff;
      color: #42526c;
      padding: 7px 13px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .language-switch button[aria-pressed="true"] {
      background: #174a98;
      color: #fff;
      border-color: #174a98;
    }

    .language-switch button:focus-visible {
      outline: 3px solid #7daef7;
      outline-offset: 2px;
    }

    .stores {
      display: grid;
      gap: 12px;
    }

    .store {
      display: flex;
      align-items: center;
      gap: 15px;
      text-align: left;
      text-decoration: none;
      color: white;
      border: 2px solid transparent;
      border-radius: 15px;
      padding: 13px 19px;
      min-height: 76px;
      transition: transform .15s, filter .15s;
    }

    .store--apple {
      background: #174a98;
      border-color: #174a98;
    }

    .store--google {
      background: #e52b37;
      border-color: #e52b37;
    }

    .store:hover {
      filter: brightness(.9);
      transform: translateY(-2px);
    }

    .store:focus-visible {
      outline: 3px solid #e52b37;
      outline-offset: 3px;
    }

    .store svg {
      width: 35px;
      height: 35px;
      flex: none;
      fill: currentColor;
    }

    .store small {
      display: block;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .2px;
      margin-bottom: 3px;
    }

    .store strong {
      display: block;
      font-size: 21px;
      letter-spacing: -.4px;
    }

    .foot {
      font-size: 12px;
      color: #7a8495;
      margin-top: 28px;
    }

    @media (prefers-reduced-motion: reduce) {
      .store {
        transition: none;
      }
      .store:hover {
        transform: none;
      }
    }
  .store--apple svg {
  width: 52px;
  height: 52px;
  margin-left: -8px;
  margin-right: -8px;
}
  </style>
</head>

<body>
  <main class="panel">

    <nav class="language-switch" aria-label="Language / Γλώσσα">
      <button type="button" data-lang="el" aria-pressed="true">ΕΛ</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </nav>

    <img
      class="brand-logo"
      src="https://intersportgrazure.lhscdn.com/uploads/sites/494076/siteimage-logonormal.png?lm=78b8fb37bb35720875ab269748147334"
      alt="INTERSPORT logo"
      loading="eager"
    >

    <h1 id="heading">Κατέβασε το INTERSPORT App</h1>

    <p id="description">Διαθέσιμο για iOS και Android.</p>

    <div class="stores">

      <a
        class="store store--apple"
        href="https://apps.apple.com/us/app/intersport-greece/id6449537338"
        aria-label="Λήψη του INTERSPORT από το App Store"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17.05 12.54c.02 2.14 1.88 2.85 1.9 2.86-.02.05-.3 1.03-.98 2.05-.59.88-1.2 1.76-2.16 1.78-.95.02-1.25-.57-2.34-.57-1.08 0-1.42.55-2.32.59-.94.04-1.65-.96-2.24-1.84-1.21-1.75-2.13-4.94-.89-7.1a3.47 3.47 0 0 1 2.94-1.79c.92-.02 1.78.63 2.34.63.56 0 1.62-.78 2.73-.66.47.02 1.79.19 2.64 1.44-.07.04-1.6.93-1.62 2.61ZM15.3 7.33a3.3 3.3 0 0 0 .75-2.45 3.38 3.38 0 0 0-2.18 1.16 3.15 3.15 0 0 0-.78 2.38 2.82 2.82 0 0 0 2.21-1.09Z" transform="translate(-1 -1)"/>
        </svg>
        <span>
          <small id="apple-small">Διαθέσιμο στο</small>
          <strong>App Store</strong>
        </span>
      </a>

      <a
        class="store store--google"
        href="https://play.google.com/store/apps/details?id=gr.intersport.app&amp;hl=en"
        aria-label="Λήψη του INTERSPORT από το Google Play"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 2.5c-.32.23-.5.65-.5 1.22v16.56c0 .57.18.99.5 1.22L13.1 12 3.5 2.5Zm1.3-.42L14.5 11l2.8-2.8L5.4 1.75c-.23-.12-.43-.17-.6-.17Zm13.8 6.85-3.16 3.07 3.16 3.07 3.6-2.03c1.07-.61 1.07-1.47 0-2.08l-3.6-2.03ZM14.5 13l-9.7 8.92c.17 0 .37-.05.6-.17l11.9-6.45-2.8-2.3Z"/>
        </svg>
        <span>
          <small id="google-small">Διαθέσιμο στο</small>
          <strong>Google Play</strong>
        </span>
      </a>

    </div>

    <div class="foot" id="footer">
      INTERSPORT Greece · Σύνδεσμοι λήψης εφαρμογής
    </div>

  </main>

  <script>
    (function () {
      const translations = {
        el: {
          title: 'Κατέβασε το INTERSPORT App',
          description: 'Διαθέσιμο για iOS και Android.',
          apple: 'Διαθέσιμο στο',
          google: 'Διαθέσιμο στο',
          footer: 'INTERSPORT Greece · Σύνδεσμοι λήψης εφαρμογής',
          appleLabel: 'Λήψη του INTERSPORT από το App Store',
          googleLabel: 'Λήψη του INTERSPORT από το Google Play'
        },
        en: {
          title: 'Get the INTERSPORT App',
          description: 'Available for iOS and Android.',
          apple: 'Download on the',
          google: 'GET IT ON',
          footer: 'INTERSPORT Greece · Official app download links',
          appleLabel: 'Download INTERSPORT on the Apple App Store',
          googleLabel: 'Get INTERSPORT on Google Play'
        }
      };

      function setLanguage(lang) {
        const selectedLang = translations[lang] ? lang : 'el';
        const t = translations[selectedLang];

        document.documentElement.lang = selectedLang;
        document.title = t.title;
        document.querySelector('meta[name="description"]').content = t.description;
        document.getElementById('heading').textContent = t.title;
        document.getElementById('description').textContent = t.description;
        document.getElementById('apple-small').textContent = t.apple;
        document.getElementById('google-small').textContent = t.google;
        document.getElementById('footer').textContent = t.footer;

        document.querySelector('.store--apple')
          .setAttribute('aria-label', t.appleLabel);

        document.querySelector('.store--google')
          .setAttribute('aria-label', t.googleLabel);

        document.querySelectorAll('[data-lang]').forEach(button => {
          button.setAttribute(
            'aria-pressed',
            String(button.dataset.lang === selectedLang)
          );
        });
      }

      document.querySelectorAll('[data-lang]').forEach(button => {
        button.addEventListener('click', () => {
          setLanguage(button.dataset.lang);
        });
      });

      const queryLang = new URLSearchParams(window.location.search).get('lang');
      setLanguage(queryLang === 'en' ? 'en' : 'el');
    })();
  </script>
</body>
</html>
